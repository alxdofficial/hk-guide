<title>Hong Kong malls — brand directory</title>

<style>
  :root{--ink:#23211e;--muted:#78756c;--line:#e5e1d8;--bg:#faf8f3;--card:#fff;--accent:#1f3a5f;--chip:#eef1f5}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  header{padding:14px 18px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0 0 2px;font-weight:600}
  header p{margin:0;font-size:12.5px;color:var(--muted)}
  .home{display:inline-block;font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;margin-bottom:3px}
  .home:hover{text-decoration:underline}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{font:inherit;font-size:13px;padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;color:var(--ink)}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wrap{padding:14px 18px;max-width:1100px;margin:0 auto}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  input[type=search]{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:230px;flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;user-select:none}
  .chip.on{background:var(--chip);border-color:#c9d3e0;color:var(--accent);font-weight:600}
  .count{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
  table{width:100%;min-width:560px;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13.5px}
  th,td{text-align:left;padding:8px 11px;border-bottom:1px solid #f0ede6}
  th{background:#f6f3ec;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  td.brand{font-weight:600}
  .tier{font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .t-ultra{background:#2a1a3e;color:#fff}.t-lux{background:#5b3f86;color:#fff}
  .t-upper{background:#2f6f9e;color:#fff}.t-mid{background:#3d8f6f;color:#fff}.t-mass{background:#b0873a;color:#fff}
  .cat{font-size:11px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  @media(max-width:600px){
    .cards{grid-template-columns:1fr}
    header h1{font-size:16px}
    input[type=search]{min-width:0}
    .wrap{padding:12px}
  }
  .mall{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px}
  .mall h3{margin:0 0 3px;font-size:15px}
  .mall .loc{font-size:12px;color:var(--muted);margin-bottom:8px}
  .mall .anchors{font-size:12.5px;margin:8px 0;padding:8px 10px;background:#f6f3ec;border-radius:8px}
  .mall .anchors b{color:var(--accent)}
  .mall details{margin-top:6px;font-size:12.5px}
  .mall summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
  .mall .brandline{margin:5px 0}
  .mall .brandline b{font-weight:600;color:#444}
  .mall a{color:var(--accent);font-size:12px}
  .hide{display:none}
  .note{font-size:11.5px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>

<header>

  <h1>Hong Kong malls — brand directory</h1>
  <p>17 major malls · search a brand to see which malls carry it, or browse each mall. Tiers from ultra-luxury to mass-market. Lists are representative, not exhaustive.</p>
  <div class="tabs">

// flatten to rows
const rows=[];
for(const m of MALLS) for(const c in m.b) for(const br of m.b[c])
  rows.push({brand:br,cat:c,mall:m.n,area:m.area,tier:m.tier});

let activeCats=new Set(CATS);
const catchips=document.getElementById("catchips");
CATS.forEach(c=>{const el=document.createElement("span");el.className="chip on";el.textContent=c;
  el.onclick=()=>{if(activeCats.has(c)){activeCats.delete(c);el.classList.remove("on");}else{activeCats.add(c);el.classList.add("on");}render();};
  catchips.appendChild(el);});

let sortK="brand",sortAsc=true;
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;
  if(sortK===k)sortAsc=!sortAsc;else{sortK=k;sortAsc=true;}render();});

const tierRank={ultra:0,lux:1,upper:2,mid:3,mass:4};
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  let r=rows.filter(x=>activeCats.has(x.cat)&&(q===""||x.brand.toLowerCase().includes(q)||x.mall.toLowerCase().includes(q)));
  r.sort((a,b)=>{let av=a[sortK],bv=b[sortK];
    if(sortK==="tier"){av=tierRank[a.tier];bv=tierRank[b.tier];}
    if(av<bv)return sortAsc?-1:1;if(av>bv)return sortAsc?1:-1;return a.brand.localeCompare(b.brand);});
  document.getElementById("count").textContent=`${r.length} store listings across ${new Set(r.map(x=>x.mall)).size} malls`;
  document.getElementById("rows").innerHTML=r.map(x=>{const t=TIER[x.tier];
    return `<tr><td class="brand">${x.brand}</td><td class="cat">${x.cat}</td><td>${x.mall}</td><td>${x.area}</td><td><span class="tier ${t[1]}">${t[0]}</span></td></tr>`;}).join("")
    ||`<tr><td colspan="5" style="color:#999;padding:16px">No matches. Try a different brand or re-enable categories.</td></tr>`;
}
document.getElementById("q").addEventListener("input",render);

// browse cards
document.getElementById("cards").innerHTML=MALLS.map(m=>{const t=TIER[m.tier];
  const lines=Object.keys(m.b).map(c=>`<div class="brandline"><b>${c}:</b> ${m.b[c].join(", ")}</div>`).join("");
  return `<div class="mall">
    <h3>${m.n} <span class="tier ${t[1]}">${t[0]}</span></h3>
    <div class="loc">${m.area}</div>
    <div class="anchors"><b>Anchors:</b> ${m.anchors}</div>
    <details><summary>Show notable brands</summary>${lines}</details>
    <div style="margin-top:8px"><a href="${m.url}" target="_blank" rel="noopener">Official store directory ↗</a></div>
  </div>`;}).join("");

// tabs
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  const v=t.dataset.view;
  document.getElementById("find").classList.toggle("hide",v!=="find");
  document.getElementById("browse").classList.toggle("hide",v!=="browse");
});
document.getElementById("srcnote").innerHTML="Compiled from each mall's official store directory (2026) plus reputable guides. Directories change often — tap a mall's official link for the live list. A few tenants flagged during research as under-renovation or pop-up may have shifted.";
render();
</script>
</body>
</html>
