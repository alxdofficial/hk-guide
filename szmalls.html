<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shenzhen malls — brand directory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23227a6b'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white'%3ESZ%3C/text%3E%3C/svg%3E">
<style>
  :root{--ink:#23211e;--muted:#78756c;--line:#e5e1d8;--bg:#faf8f3;--card:#fff;--accent:#227a6b;--chip:#e7f2ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  header{padding:14px 18px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0 0 2px;font-weight:600}
  header p{margin:0;font-size:12.5px;color:var(--muted)}
  .home{display:inline-block;font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;margin-bottom:3px}
  .home:hover{text-decoration:underline}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{font:inherit;font-size:13px;padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;color:var(--ink)}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wrap{padding:14px 18px;max-width:1100px;margin:0 auto}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  input[type=search]{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:230px;flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;user-select:none}
  .chip.on{background:var(--chip);border-color:#b8ddd4;color:var(--accent);font-weight:600}
  .count{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
  table{width:100%;min-width:560px;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13.5px}
  th,td{text-align:left;padding:8px 11px;border-bottom:1px solid #f0ede6}
  th{background:#f6f3ec;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  td.brand{font-weight:600}
  .tier{font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .t-ultra{background:#2a1a3e;color:#fff}.t-lux{background:#5b3f86;color:#fff}
  .t-upper{background:#2f6f9e;color:#fff}.t-mid{background:#3d8f6f;color:#fff}.t-mass{background:#b0873a;color:#fff}
  .cat{font-size:11px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  @media(max-width:600px){.cards{grid-template-columns:1fr}header h1{font-size:16px}input[type=search]{min-width:0}.wrap{padding:12px}}
  .mall{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px}
  .mall h3{margin:0 0 3px;font-size:15px}
  .mall .loc{font-size:12px;color:var(--muted);margin-bottom:8px}
  .mall .anchors{font-size:12.5px;margin:8px 0;padding:8px 10px;background:#f6f3ec;border-radius:8px}
  .mall .anchors b{color:var(--accent)}
  .mall details{margin-top:6px;font-size:12.5px}
  .mall summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
  .mall .brandline{margin:5px 0}
  .mall .brandline b{font-weight:600;color:#444}
  .mall a{color:var(--accent);font-size:12px}
  .hide{display:none}
  .note{font-size:11.5px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">← Guide home</a>
  <h1>Shenzhen malls — brand directory</h1>
  <p>12 major malls · search a brand to see which malls carry it, or browse each mall. Tenant lists change fast in Shenzhen — treat as representative, not exhaustive.</p>
  <div class="tabs">
    <button class="tab active" data-view="find">Find a brand</button>
    <button class="tab" data-view="browse">Browse malls</button>
  </div>
</header>
<div class="wrap">
  <div id="find">
    <div class="controls">
      <input type="search" id="q" placeholder="Search a brand (e.g. Uniqlo, Apple, Lululemon, Heytea)…">
    </div>
    <div class="chips" id="catchips"></div>
    <div class="count" id="count"></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th data-k="brand">Brand ▾</th><th data-k="cat">Category</th><th data-k="mall">Mall</th><th data-k="area">Area</th><th data-k="tier">Tier</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <div id="browse" class="hide"><div class="cards" id="cards"></div></div>
  <div class="note" id="srcnote"></div>
</div>
<script>
const TIER={ultra:["Ultra-luxury","t-ultra"],lux:["Luxury","t-lux"],upper:["Upper-mid","t-upper"],mid:["Mid-market","t-mid"],mass:["Mass / market","t-mass"]};
const CATS=["Luxury fashion","Watches & jewellery","Contemporary / mid fashion","Beauty & cosmetics","Sportswear & outdoor","Electronics & tech","Kids & toys","Home & lifestyle","Dining & F&B"];
const MALLS=[
 {n:"MixC 万象城",area:"Luohu",tier:"ultra",url:"https://www.apple.com.cn/retail/mixcshenzhen/",
  anchors:"Apple Store · Ole' supermarket · Golden Harvest cinema · real-ice rink · B1 beauty gallery",
  b:{"Luxury fashion":["Louis Vuitton","Gucci","Prada","Hermès","Dior","Fendi","Bottega Veneta","Miu Miu","Ferragamo","Zegna","Dolce & Gabbana","Emporio Armani","BOSS"],
     "Watches & jewellery":["Cartier","Bvlgari","Tiffany & Co.","Montblanc"],
     "Contemporary / mid fashion":["Michael Kors","Tory Burch","Coach","Longchamp","Issey Miyake"],
     "Beauty & cosmetics":["Dior Beauty","Gucci Beauty","Christian Louboutin Beauty","Creed","Diptyque"],
     "Sportswear & outdoor":["Lululemon","Salomon"],
     "Electronics & tech":["Apple","Huawei"],
     "Home & lifestyle":["Pop Mart popop"],
     "Dining & F&B":["Starbucks","Heytea 喜茶"]}},
 {n:"MixC World 万象天地",area:"Nanshan",tier:"lux",url:null,
  anchors:"HAUS NOWHERE concept store · Ole' · Broadway IMAX · Huawei flagship (no Apple) · rooftop elephant",
  b:{"Luxury fashion":["Kenzo","Michael Kors","Moschino","McQ","Neil Barrett","Coach","Mugler"],
     "Contemporary / mid fashion":["Uniqlo","Zara","MUJI","ICICLE","Ports","JORYA","Marisfrolg","MO&Co.","snidel","MOUSSY","Urban Revivo","Aape","Evisu"],
     "Beauty & cosmetics":["Tamburins"],
     "Sportswear & outdoor":["Nike","Adidas","Skechers","On"],
     "Electronics & tech":["Huawei"],
     "Home & lifestyle":["MUJI","The Beast 野兽派","roseonly"],
     "Dining & F&B":["Blue Bottle Coffee","Starbucks","Seesaw","Cova","Gaga Chef"]}},
 {n:"One Avenue 卓悦中心",area:"Futian",tier:"upper",url:"https://www.excegroup.com/",
  anchors:"Ole' · CGV cinema · Huawei flagship · ice rink (no Apple) · 800 m open-street district",
  b:{"Luxury fashion":["Armani","PINKO","Patrizia Pepe","DKNY","Vera Wang"],
     "Contemporary / mid fashion":["Uniqlo","Massimo Dutti","X11"],
     "Beauty & cosmetics":["HARMAY 話梅","Charlotte Tilbury","L'Artisan Parfumeur","Penhaligon's"],
     "Sportswear & outdoor":["Nike","Adidas","Brompton"],
     "Electronics & tech":["Huawei"],
     "Home & lifestyle":["FNJI 梵几","Sisyphe 西西弗 bookstore"],
     "Dining & F&B":["Heytea 喜茶","M Stand","Tao Tao Ju 陶陶居","L'Avenue"]}},
 {n:"COCO Park 福田购物公园",area:"Futian",tier:"upper",url:"http://www.cocopark.cn/",
  anchors:"Apple flagship · Yonghui Bravo + Super Species · Broadway cinema · famous open-air bar street",
  b:{"Beauty & cosmetics":["Dior Beauty","Lancôme","YSL","Armani","Guerlain","Swarovski"],
     "Contemporary / mid fashion":["Uniqlo"],
     "Sportswear & outdoor":["adidas Originals","Nike Kicks Lounge","FILA Fusion","PUMA","Li-Ning 李宁","Skechers","Lululemon"],
     "Electronics & tech":["Apple","Huawei","Tesla"],
     "Home & lifestyle":["Tomato Pocket 番茄口袋","The Green Party"],
     "Dining & F&B":["Heytea 喜茶","Starbucks","Häagen-Dazs","Venchi","BreadTalk","Sisyphe bookstore"]}},
 {n:"UpperHills 深业上城",area:"Futian",tier:"lux",url:"https://www.sz-upperhills.com/",
  anchors:"Galeries Lafayette 老佛爷 · Ole' · Emperor UA cinema · MUJI Hotel (Sony store; no Apple) · park-side",
  b:{"Luxury fashion":["Self-Portrait","MM6 Maison Margiela","Thom Browne"],
     "Contemporary / mid fashion":["Uniqlo","Zara"],
     "Beauty & cosmetics":["MEMO","Bon Parfumeur","Matière Première","Documents 闻献"],
     "Electronics & tech":["Sony"],
     "Home & lifestyle":["Pop Mart 泡泡玛特","MUJI"],
     "Dining & F&B":["Café Kitsuné","Starbucks Reserve","Tim Hortons"]}},
 {n:"PA Mall 平安金融中心",area:"Futian",tier:"lux",url:null,
  anchors:"Ole' · Emperor IMAX · Sundan electronics flagship · Michelin / Black-Pearl dining (no Apple)",
  b:{"Luxury fashion":["Vivienne Westwood","Polo Ralph Lauren","Maison Margiela"],
     "Sportswear & outdoor":["HOKA"],
     "Electronics & tech":["Sundan 顺电"],
     "Dining & F&B":["Xin Rong Ji 新荣记","Wolfgang's Steakhouse","Morton's","Putien 莆田","Starbucks Reserve","Manner","M Stand","tea'stone"]}},
 {n:"KK Mall 京基100",area:"Luohu",tier:"lux",url:"http://kkmall.kingkeybanner.com/Shopping/",
  anchors:"BLT supermarket · UA IMAX (SZ's first) · FOOD IN food market",
  b:{"Luxury fashion":["Gucci","Prada","Ports","Armani","Anteprima"],
     "Watches & jewellery":["Cartier"],
     "Contemporary / mid fashion":["Zara","H&M","Uniqlo","Ochirly","Lacoste","Calvin Klein","Timberland"],
     "Sportswear & outdoor":["Lululemon","Decathlon 迪卡侬"],
     "Electronics & tech":["vivo","Lenovo 联想"],
     "Home & lifestyle":["Sisyphe 西西弗 bookstore","Vector Coffee"],
     "Dining & F&B":["Xibei 西贝莜面村"]}},
 {n:"Uniwalk 前海壹方城",area:"Bao'an / Qianhai",tier:"upper",url:"https://www.unicenter.com.cn/",
  anchors:"Apple Store (2025) · Ole' · CGV IMAX/4DX · Mi Bookstore · B2 anime district · SZ's largest mall",
  b:{"Luxury fashion":["Hugo Boss","Polo Ralph Lauren"],
     "Watches & jewellery":["Cartier","OMEGA","IWC"],
     "Beauty & cosmetics":["Chanel Beauty","Lancôme","Dior Beauty","Estée Lauder","Sephora"],
     "Contemporary / mid fashion":["Zara","Uniqlo","MUJI","H&M","Zara Home","I.T","G2000","Goelia 歌莉娅"],
     "Sportswear & outdoor":["HOKA","MAIA ACTIVE","Decathlon","AIGLE"],
     "Electronics & tech":["Apple"],
     "Kids & toys":["LEGO","Pokémon 三月兽"],
     "Home & lifestyle":["Mi Bookstore 覔书店"],
     "Dining & F&B":["Heytea 喜茶","Nayuki 奈雪","Shake Shack","麻六记"]}},
 {n:"Coastal City 海岸城",area:"Nanshan (Houhai)",tier:"upper",url:"http://www.coastalcity.cn/",
  anchors:"Ole' · 5-hall cinema · real-ice rink (no Apple)",
  b:{"Contemporary / mid fashion":["Uniqlo","MUJI","Massimo Dutti","Sandro","Maje","Ellassay 歌力思","Marisfrolg 玛丝菲尔"],
     "Electronics & tech":["Sundan 顺电"],
     "Home & lifestyle":["MUJI","LEGO"],
     "Dining & F&B":["Nayuki 奈雪","点都德 dim sum"]}},
 {n:"Yitian Holiday Plaza 益田假日广场",area:"Nanshan (OCT)",tier:"upper",url:"https://www.apple.com.cn/retail/holidayplazashenzhen/",
  anchors:"Apple (SZ's FIRST) · Ole' · China Film cinema · All-Star ice rink · COSCIA 蔻莎 luxury buyer store",
  b:{"Luxury fashion":["Emporio Armani","Ferragamo","BOSS","Burberry","Polo Ralph Lauren","GIADA","COSCIA 蔻莎"],
     "Watches & jewellery":["Emperor Jewellery 英皇珠宝"],
     "Contemporary / mid fashion":["Uniqlo","Zara","H&M","COS","MUJI"],
     "Beauty & cosmetics":["SkinCeuticals 修丽可","Kiehl's","Helena Rubinstein"],
     "Sportswear & outdoor":["The North Face","Skechers"],
     "Electronics & tech":["Apple","Xiaomi"],
     "Home & lifestyle":["MUJI","Miniso"],
     "Dining & F&B":["gaga","Cou Cou 湊湊","Haidilao 海底捞"]}},
 {n:"Sea World 海上世界",area:"Shekou, Nanshan",tier:"upper",url:null,
  anchors:"Open-air waterfront district · Minghua ship · nightly music-fountain · expat bar street (dining-led)",
  b:{"Dining & F&B":["Paulaner Brauhaus 帕拉娜","Baker & Spice","Latina 拉蒂娜","Terrace rooftop bar","Starbucks","Pacific Coffee"]}},
 {n:"Raffles City 来福士",area:"Nanshan",tier:"mid",url:"https://www.capitaland.com/en/find-a-property/global-property-listing/retail/raffles-city-shenzhen.html",
  anchors:"Taste supermarket · Broadway / The Palace cinema · bookstore (no Apple)",
  b:{"Contemporary / mid fashion":["Uniqlo","GUESS","G-STAR RAW","Vero Moda","Calvin Klein Jeans","JNBY"],
     "Sportswear & outdoor":["Nike","adidas Originals","FILA","PUMA","Converse"],
     "Dining & F&B":["Starbucks","Pacific Coffee","Blue Frog"]}},
];

const rows=[];
for(const m of MALLS) for(const c in m.b) for(const br of m.b[c])
  rows.push({brand:br,cat:c,mall:m.n,area:m.area,tier:m.tier});

let activeCats=new Set(CATS);
const catchips=document.getElementById("catchips");
CATS.forEach(c=>{const el=document.createElement("span");el.className="chip on";el.textContent=c;
  el.onclick=()=>{if(activeCats.has(c)){activeCats.delete(c);el.classList.remove("on");}else{activeCats.add(c);el.classList.add("on");}render();};
  catchips.appendChild(el);});

let sortK="brand",sortAsc=true;
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;
  if(sortK===k)sortAsc=!sortAsc;else{sortK=k;sortAsc=true;}render();});

const tierRank={ultra:0,lux:1,upper:2,mid:3,mass:4};
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  let r=rows.filter(x=>activeCats.has(x.cat)&&(q===""||x.brand.toLowerCase().includes(q)||x.mall.toLowerCase().includes(q)));
  r.sort((a,b)=>{let av=a[sortK],bv=b[sortK];
    if(sortK==="tier"){av=tierRank[a.tier];bv=tierRank[b.tier];}
    if(av<bv)return sortAsc?-1:1;if(av>bv)return sortAsc?1:-1;return a.brand.localeCompare(b.brand);});
  document.getElementById("count").textContent=`${r.length} store listings across ${new Set(r.map(x=>x.mall)).size} malls`;
  document.getElementById("rows").innerHTML=r.map(x=>{const t=TIER[x.tier];
    return `<tr><td class="brand">${x.brand}</td><td class="cat">${x.cat}</td><td>${x.mall}</td><td>${x.area}</td><td><span class="tier ${t[1]}">${t[0]}</span></td></tr>`;}).join("")
    ||`<tr><td colspan="5" style="color:#999;padding:16px">No matches. Try a different brand or re-enable categories.</td></tr>`;
}
document.getElementById("q").addEventListener("input",render);

document.getElementById("cards").innerHTML=MALLS.map(m=>{const t=TIER[m.tier];
  const lines=Object.keys(m.b).map(c=>`<div class="brandline"><b>${c}:</b> ${m.b[c].join(", ")}</div>`).join("");
  const link=m.url?`<a href="${m.url}" target="_blank" rel="noopener">Official / store info ↗</a>`:`<span style="color:#a8a49a">No public web directory — use Dianping / WeChat mini-program</span>`;
  return `<div class="mall">
    <h3>${m.n} <span class="tier ${t[1]}">${t[0]}</span></h3>
    <div class="loc">${m.area}</div>
    <div class="anchors"><b>Anchors:</b> ${m.anchors}</div>
    <details><summary>Show notable brands</summary>${lines}</details>
    <div style="margin-top:8px">${link}</div>
  </div>`;}).join("");

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  const v=t.dataset.view;
  document.getElementById("find").classList.toggle("hide",v!=="find");
  document.getElementById("browse").classList.toggle("hide",v!=="browse");
});
document.getElementById("srcnote").innerHTML="Compiled July 2026 from official pages (Apple, Huawei, KK Mall, CapitaLand, Excellence Group) and 2024–2026 Chinese retail press. Shenzhen tenant rosters churn fast and most malls publish only via WeChat mini-programs — verify on Dianping 大众点评 before a special trip. Dongmen 东门 and Huaqiangbei 华强北 are market districts — see them on the Shenzhen map. Note: true hard-luxury (LV/Chanel/Hermès) concentrates at MixC; Apple Stores only at MixC, Yitian, Uniwalk and COCO Park.";
render();
</script>
</body>
</html>
